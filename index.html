<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1233">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff3ee;--rose:#ff8fab;--glow:#ffc2d1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;background:radial-gradient(ellipse at 50% 108%,#6b2a63 0,#3a1a58 38%,#1d1233 72%,#120a24 100%)}
#sky,#garden,#fall{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,226,140,.7);opacity:0;animation:fly 9s ease-in-out infinite}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}20%,80%{opacity:.9}50%{transform:translate(30px,-40px)}100%{opacity:0;transform:translate(-20px,-80px)}}
.ground{position:absolute;left:-5%;right:-5%;bottom:-2px;height:7vh;background:linear-gradient(#1b2a2a,#0e1620);border-radius:50% 50% 0 0/100% 100% 0 0}
.flower{position:absolute;bottom:3vh;width:0;height:0;transform-origin:bottom;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.stem{position:absolute;bottom:0;left:-2px;width:4px;border-radius:2px;background:linear-gradient(#5fae7a,#2c6b50);transform-origin:bottom;transform:scaleY(0);animation:grow 2.2s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.leaf{position:absolute;width:22px;height:10px;border-radius:100% 0;background:#4a9a70;opacity:0;animation:pop .8s ease forwards}
@keyframes pop{to{opacity:1}}
.bloom{position:absolute;left:0;width:0;height:0}
.petal{position:absolute;left:-12px;bottom:0;width:24px;height:54px;border-radius:50% 50% 50% 50%/75% 75% 25% 25%;transform-origin:50% 100%;transform:rotate(var(--a)) scale(0);background:radial-gradient(ellipse at 50% 85%,var(--c2),var(--c1) 70%);box-shadow:0 0 14px rgba(255,170,200,.35);animation:open 1.8s cubic-bezier(.2,.9,.25,1.15) forwards}
@keyframes open{to{transform:rotate(var(--a)) scale(1)}}
.core{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:radial-gradient(#fff2b8,#f6b93b);transform:scale(0);animation:open0 .8s ease forwards}
@keyframes open0{to{transform:scale(1)}}
#ui{position:absolute;left:0;right:0;top:0;height:60%;display:grid;place-items:center;padding:20px;z-index:5}
#go{font:inherit;font-style:italic;font-weight:600;font-size:clamp(22px,4.6vw,30px);color:#3a1a58;background:linear-gradient(135deg,#ffd6e0,#ff8fab);border:0;border-radius:999px;padding:.7em 1.6em;cursor:pointer;opacity:0;animation:pop 1.2s ease 3.4s forwards,beat 2.6s ease-in-out 4.6s infinite;box-shadow:0 0 0 0 rgba(255,143,171,.6),0 10px 30px rgba(0,0,0,.35)}
@keyframes beat{50%{box-shadow:0 0 0 16px rgba(255,143,171,0),0 10px 30px rgba(0,0,0,.35);transform:scale(1.04)}}
#go:focus-visible{outline:3px solid #fff;outline-offset:4px}
#msg{display:none;max-width:460px;text-align:center;padding:28px 26px;border-radius:26px;background:rgba(29,18,51,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,194,209,.35);box-shadow:0 0 60px rgba(255,143,171,.25)}
#msg.show{display:block}
#msg h1{margin:0 0 14px;font-size:clamp(30px,7vw,42px);font-weight:600;font-style:italic;color:var(--glow)}
#msg p{margin:.45em 0;text-wrap:balance;font-size:clamp(19px,4.6vw,24px);line-height:1.45;font-style:italic;opacity:0;transform:translateY(8px);animation:line 1.1s ease forwards}
@keyframes line{to{opacity:1;transform:none}}
.fp{position:absolute;top:-30px;width:14px;height:18px;border-radius:50% 50% 50% 50%/75% 75% 25% 25%;background:linear-gradient(var(--c1),var(--c2));opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="garden"><div class="ground"></div></div>
<div id="fall"></div>
<div id="ui">
  <button id="go" type="button">Click this for a message</button>
  <div id="msg" role="status" aria-live="polite"></div>
</div>
<script>
/* ===== Edit these three things: HEADING, FROM, LINES ===== */
const HEADING = "Hi baby! Surprise!!!!";
const FROM = "Noel Shane";
const LINES = [
  "I just wanna say I love you to the moon and back!",
  "To Infinity and Beyond!",
  "Lapit na anniversary natin,",
  "advance happy anniversary baby! 💗"
];
/* ==================================== */
const $ = s => document.querySelector(s), rnd = (a, b) => a + Math.random() * (b - a);
const PAL = [["#ffd6e0","#ff6f91"],["#ffe5d0","#ff9e7a"],["#f3e1ff","#b57edc"],["#fff5f7","#ffa8c5"],["#ffeaa7","#ff9f68"],["#ffc2d1","#e8567f"]];
const sky = $('#sky'), garden = $('#garden');
for (let i = 0; i < 70; i++) { const s = document.createElement('i'); s.className = 'star'; s.style.cssText = `left:${rnd(0,100)}%;top:${rnd(0,70)}%;animation-delay:${rnd(0,4)}s`; sky.appendChild(s); }
for (let i = 0; i < 16; i++) { const f = document.createElement('i'); f.className = 'fly'; f.style.cssText = `left:${rnd(3,97)}%;top:${rnd(45,92)}%;animation-delay:${rnd(2,9)}s;animation-duration:${rnd(7,12)}s`; garden.appendChild(f); }
const N = innerWidth < 600 ? 6 : 10, vh = innerHeight / 100;
for (let i = 0; i < N; i++) {
  const H = rnd(17, 36) * vh, sd = rnd(0, 1.6), P = PAL[i % PAL.length], sc = rnd(.7, 1.15), n = Math.random() < .5 ? 8 : 10;
  const f = document.createElement('div'); f.className = 'flower';
  f.style.left = (10 + (i + .5) / N * 80 + rnd(-2, 2)) + '%'; f.style.animationDelay = rnd(0, 3) + 's';
  let h = `<div class="stem" style="height:${H}px;animation-delay:${sd}s"></div>`;
  h += `<div class="leaf" style="bottom:${H*.3}px;left:2px;transform:rotate(-20deg);animation-delay:${sd+1.2}s"></div><div class="leaf" style="bottom:${H*.5}px;left:-24px;transform:scaleX(-1) rotate(-20deg);animation-delay:${sd+1.4}s"></div>`;
  h += `<div class="bloom" style="bottom:${H}px;transform:scale(${sc})">`;
  for (let k = 0; k < n; k++) h += `<div class="petal" style="--a:${k*360/n}deg;--c1:${P[1]};--c2:${P[0]};animation-delay:${sd+2.1+k*.09}s"></div>`;
  h += `<div class="core" style="animation-delay:${sd+3}s"></div></div>`;
  f.innerHTML = h; garden.appendChild(f);
}
function petals(count) {
  const box = $('#fall');
  for (let i = 0; i < count; i++) {
    const p = document.createElement('i'), c = PAL[i % PAL.length]; p.className = 'fp';
    p.style.cssText = `left:${rnd(0,100)}%;--c1:${c[0]};--c2:${c[1]};--dx:${rnd(-80,80)}px;--r:${rnd(180,720)}deg;animation-duration:${rnd(5,10)}s;animation-delay:${rnd(0,3)}s`;
    box.appendChild(p); setTimeout(() => p.remove(), 14000);
  }
}
$('#go').addEventListener('click', () => {
  $('#go').style.display = 'none';
  const m = $('#msg');
  m.innerHTML = `<h1></h1>` + LINES.map((t, i) => `<p style="animation-delay:${1+i*1.3}s"></p>`).join('') + `<p style="animation-delay:${1+LINES.length*1.3}s;color:var(--glow)"></p>`;
  m.children[0].textContent = HEADING;
  LINES.forEach((t, i) => m.children[i + 1].textContent = t);
  m.lastChild.textContent = '— ' + FROM;
  m.classList.add('show'); petals(40);
  setTimeout(() => petals(25), 5000);
});
</script>
</body>
</html>
